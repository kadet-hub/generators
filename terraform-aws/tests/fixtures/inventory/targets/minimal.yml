# Minimal: one VPC across two AZs without NAT, one bucket with defaults
classes: []

parameters:
  kapitan:
    vars:
      target: minimal
    compile:
      - input_type: kadet
        input_paths:
          - lib/terraform-aws
        output_path: terraform/
        output_type: json

  generators:
    terraform-aws:
      region: eu-central-1
      vpc:
        main:
          cidr: 10.0.0.0/16
          azs: [eu-central-1a, eu-central-1b]
      s3_bucket:
        artifacts:
          bucket: example-artifacts-eu-central-1
