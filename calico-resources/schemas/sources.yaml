# closed like kubeconform strict mode: every node with properties gets
# additionalProperties: false, except preserve-unknown-fields nodes, maps and
# allOf/anyOf/oneOf/not branches. Unknown fields in the output therefore fail.
# The CRDs are the native projectcalico.org/v3 CRDs of manifests/v3_projectcalico_org.yaml.
