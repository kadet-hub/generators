# Complete: every section, flat keys, shorthands, spec passthrough and a flat
# key that overrides spec (logs the precedence warning)
classes: []
parameters:
  kapitan:
    vars:
      target: complete
    compile:
      - input_type: kadet
        input_paths:
          - lib/crossplane
        output_path: manifests/
  namespace: platform
  generators:
    crossplane:
      namespace: team-a
      providers:
        crossplane-contrib-provider-family-aws:
          package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws
          version: v2.9.0
          revision_activation_policy: Manual
          revision_history_limit: 3
          runtime_config: default
        crossplane-contrib-provider-aws-s3:
          labels:
            team: platform
          annotations:
            example.com/owner: platform
          package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3
          digest: sha256:ee6bece46dbb54cc3f0233961f5baac317fa4e4a81b41198bdc72fc472d113d0
          package_pull_policy: IfNotPresent
          package_pull_secrets:
            - name: registry-credentials
          skip_dependency_resolution: false
          ignore_crossplane_constraints: false
          common_labels:
            example.com/cost-center: platform
          common_annotations:
            example.com/owner: platform
          spec:
            packagePullPolicy: Always
      functions:
        function-patch-and-transform:
          package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
          version: v0.11.0
        function-auto-ready:
          package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
          version: v0.7.0
          digest: sha256:989e7bb4704859cbd6475cc61255b4b4ad53483ea43f3d2d1e4be5e3ff678869
          revision_history_limit: 2
      composite_resource_definitions:
        buckets.platform.example.com:
          labels:
            team: platform
          kind: Bucket
          version: v1alpha1
          default_composition: buckets-aws
          default_composition_update_policy: Manual
          spec_schema:
            type: object
            properties:
              region:
                type: string
                default: eu-central-1
              versioning:
                type: boolean
            required:
              - region
          status_schema:
            type: object
            properties:
              arn:
                type: string
          spec:
            names:
              categories:
                - platform
        clusterbuckets.platform.example.com:
          kind: ClusterBucket
          scope: Cluster
          enforced_composition: clusterbuckets-aws
          versions:
            - name: v1beta1
              served: true
              referenceable: true
              schema:
                openAPIV3Schema:
                  type: object
                  properties:
                    spec:
                      type: object
                      properties:
                        region:
                          type: string
            - name: v1alpha1
              served: true
              referenceable: false
              deprecated: true
              deprecationWarning: use platform.example.com/v1beta1 ClusterBucket
              schema:
                openAPIV3Schema:
                  type: object
                  properties:
                    spec:
                      type: object
                      properties:
                        region:
                          type: string
      compositions:
        buckets-aws:
          labels:
            provider: aws
          xrd: buckets.platform.example.com
          pipeline:
            - step: render-bucket
              function: function-patch-and-transform
              input:
                apiVersion: pt.fn.crossplane.io/v1beta1
                kind: Resources
                resources:
                  - name: bucket
                    base:
                      apiVersion: s3.aws.m.upbound.io/v1beta1
                      kind: Bucket
                      spec:
                        providerConfigRef:
                          kind: ProviderConfig
                          name: team-a
                        forProvider:
                          region: eu-central-1
                    patches:
                      - type: FromCompositeFieldPath
                        fromFieldPath: spec.region
                        toFieldPath: spec.forProvider.region
                      - type: ToCompositeFieldPath
                        fromFieldPath: status.atProvider.arn
                        toFieldPath: status.arn
            - function: function-auto-ready
        clusterbuckets-aws:
          composite_type_ref:
            apiVersion: platform.example.com/v1beta1
            kind: ClusterBucket
          spec:
            pipeline:
              - step: render-bucket
                functionRef:
                  name: function-patch-and-transform
                input:
                  apiVersion: pt.fn.crossplane.io/v1beta1
                  kind: Resources
                  resources:
                    - name: bucket
                      base:
                        apiVersion: s3.aws.m.upbound.io/v1beta1
                        kind: Bucket
                        metadata:
                          namespace: crossplane-system
                        spec:
                          forProvider:
                            region: eu-central-1
                      patches:
                        - type: FromCompositeFieldPath
                          fromFieldPath: spec.region
                          toFieldPath: spec.forProvider.region
      provider_configs:
        team-a:
          api_version: aws.m.upbound.io/v1beta1
          credentials_secret:
            name: aws-credentials
            key: credentials
        default:
          api_version: aws.m.upbound.io/v1beta1
          kind: ClusterProviderConfig
          labels:
            team: platform
          credentials_secret:
            namespace: crossplane-system
            name: aws-credentials
            key: credentials
        workload-identity:
          namespace: team-b
          api_version: aws.m.upbound.io/v1beta1
          spec:
            credentials:
              source: IRSA
