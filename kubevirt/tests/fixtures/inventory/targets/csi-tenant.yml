# CSI driver, tenant side: node plugin, the token Secret for the controller's
# kubeconfig, a default StorageClass and a VolumeSnapshotClass on the infra
# classes csi-infra allows, and the snapshot-controller with its CRDs
classes: []

parameters:
  kapitan:
    vars:
      target: csi-tenant
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubevirt
        output_path: manifests/

  generators:
    kubevirt:
      csi:
        role: tenant
        snapshot_controller: true
        storage_classes:
          kubevirt:
            default: true
            infra_storage_class: rook-ceph-block
        volume_snapshot_classes:
          kubevirt:
            default: true
            infra_snapshot_class: csi-rbdplugin-snapclass
