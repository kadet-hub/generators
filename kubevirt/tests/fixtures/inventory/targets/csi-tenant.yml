# CSI driver, tenant side: node plugin, the token Secret for the controller's
# kubeconfig, a default StorageClass and a VolumeSnapshotClass on the infra
# classes csi-infra allows
classes: []

parameters:
  kapitan:
    vars:
      target: csi-tenant
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubevirt
        output_path: manifests/

  generators:
    kubevirt:
      csi:
        role: tenant
        image: quay.io/kubevirt/kubevirt-csi-driver@sha256:44c98353e6137455d6a393ad13e04f60e10ee49fdcd00cf078f7f7084714f409
        storage_classes:
          kubevirt:
            default: true
            infra_storage_class: rook-ceph-block
        volume_snapshot_classes:
          kubevirt:
            default: true
            infra_snapshot_class: csi-rbdplugin-snapclass
