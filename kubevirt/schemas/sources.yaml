# QA-7: JSON Schemas from the openAPIV3Schema of the upstream CRDs at these releases (Apache-2.0),
# closed like kubeconform strict mode: every node with properties gets
# additionalProperties: false, except preserve-unknown-fields nodes, maps and
# allOf/anyOf/oneOf/not branches. Unknown fields in the output therefore fail.
# KubeVirt and CDI ship no CRD YAML in their trees; virt-operator and
# cdi-operator install the CRDs from the generated Go sources linked below.
# KubeVirt applies one schema to every served version of a CRD.
# The KubeVirt CSI driver has no release or tag. Its VolumeSnapshotClass CRD
# is taken at the deploy/ commit the csi section follows. The file is
# external-snapshotter's v8.7.0 CRD byte for byte.
# core, apps, rbac.authorization.k8s.io and storage.k8s.io schemas are the
# kubernetes-json-schema standalone-strict files of this Kubernetes release,
# unchanged.
kubevirt.io:
  software: KubeVirt
  version: 1.9.1
  source: https://github.com/kubevirt/kubevirt/blob/v1.9.1/pkg/virt-operator/resource/generate/components/validations_generated.go
  license: Apache-2.0
