# Complete: Installation with BGP and IPIP, APIServer, ImageSet, Goldmane and Whisker for Calico v3.33.1
classes: []

parameters:
  kapitan:
    vars:
      target: complete
    compile:
      - input_type: kadet
        input_paths:
          - lib/calico
        output_path: manifests/

  generators:
    calico:
      installation:
        labels:
          team: platform
        annotations:
          example.com/owner: platform
        variant: Calico
        kubernetes_provider: ""
        cni:
          ipam:
            type: Calico
          specVersion: "1.0.0"
        calico_network:
          bgp: Enabled
          linux_dataplane: Iptables
          node_address_autodetection_v4:
            kubernetes: NodeInternalIP
          ip_pools:
            - name: default-ipv4-ippool
              cidr: 10.244.0.0/16
              encapsulation: IPIP
              nat_outgoing: Enabled
              node_selector: all()
              block_size: 26
        control_plane_replicas: 2
        spec:
          controlPlaneReplicas: 3
          nodeMetricsPort: 9091
      api_server: {}
      imageset:
        name: calico-v3.33.1
        images:
          - image: calico/calico
            digest: sha256:fc7c26a079896ada2bea3b0bd7732430e0b095a9af726ed2150fe0894d748d4b
          - image: calico/node
            digest: sha256:1820b229f4aa6192bd2fc73930fcebd724387e6b8ff944c45061e81529bbd337
          - image: calico/third-party-cni-plugins
            digest: sha256:3e1f07559df83c36cc3ff6db7d288e8893893ea9517434d5d9cf1e326737b6f3
          - image: calico/whisker
            digest: sha256:941ce3169c2d381ee4b9f65b7cdcd27fab9d5c8e9a123284fd09a450695ff721
      goldmane: {}
      whisker: {}
