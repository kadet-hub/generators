# Minimal: one NetworkPolicy using the selector and ports shorthands
classes: []

parameters:
  kapitan:
    vars:
      target: resources-minimal
    compile:
      - input_type: kadet
        input_paths:
          - lib/calico
        output_path: manifests/

  namespace: shop
  generators:
    calico:
      network_policies:
        web:
          selector:
            app: web
          ingress:
            - action: Allow
              source:
                namespaceSelector:
                  kubernetes.io/metadata.name: ingress-nginx
              ports: [8080]
