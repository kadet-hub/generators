# Minimal: one ValidatingPolicy with the match_kinds shorthand, Kyverno's default Deny action
classes: []

parameters:
  kapitan:
    vars:
      target: minimal
    compile:
      - input_type: kadet
        input_paths:
          - lib/kyverno
        output_path: manifests/

  generators:
    kyverno:
      validating_policies:
        require-labels:
          match_kinds:
            - Pod
          validations:
            - expression: "has(object.metadata.labels) && has(object.metadata.labels.app)"
              message: "The label 'app' is required"
