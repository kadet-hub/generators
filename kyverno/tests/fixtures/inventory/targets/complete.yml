# Complete: all kyverno.io and policies.kyverno.io kinds, the match_kinds shorthand
# on rules, exceptions, cleanup and CEL policies, the deprecated spec-level keys
# moved to their replacements, spec passthrough, and flat keys overriding spec
# (each logs a warning).
classes: []

parameters:
  kapitan:
    vars:
      target: complete
    compile:
      - input_type: kadet
        input_paths:
          - lib/kyverno
        output_path: manifests/

  namespace: platform
  generators:
    kyverno:
      namespace: shop
      cluster_policies:
        disallow-privileged-containers:
          annotations:
            policies.kyverno.io/title: Disallow Privileged Containers
            policies.kyverno.io/category: Pod Security Standards (Baseline)
            policies.kyverno.io/severity: medium
          labels:
            policy-type: validation
          validation_failure_action: Enforce
          webhook_configuration:
            failurePolicy: Fail
            timeoutSeconds: 10
          rules:
            - name: privileged-containers
              match_kinds:
                - Pod
              validate:
                cel:
                  expressions:
                    - expression: >-
                        object.spec.containers.all(c, !has(c.securityContext) ||
                        !has(c.securityContext.privileged) || c.securityContext.privileged == false)
                      message: "Privileged mode is disallowed."
        add-managed-by-label:
          # flat background wins over spec.background and logs a warning
          background: false
          spec:
            background: true
            mutateExistingOnPolicyUpdate: false
          rules:
            - name: add-managed-by
              skipBackgroundRequests: true
              match:
                any:
                  - resources:
                      kinds:
                        - Pod
                        - Service
              mutate:
                patchStrategicMerge:
                  metadata:
                    labels:
                      +(app.kubernetes.io/managed-by): kapitan
        require-readiness-probe:
          # deprecated spec-level keys, rendered under webhookConfiguration
          failure_policy: Ignore
          webhook_timeout_seconds: 15
          rules:
            - name: readiness-probe
              match_kinds:
                - Pod
              validate:
                message: "A readinessProbe is required"
                pattern:
                  spec:
                    containers:
                      - readinessProbe:
                          periodSeconds: ">0"
      policies:
        require-memory-limits:
          rules:
            - name: check-memory-limits
              match_kinds:
                - Pod
              validate:
                failureAction: Audit
                message: "Memory limits are required"
                pattern:
                  spec:
                    containers:
                      - resources:
                          limits:
                            memory: "?*"
      policy_exceptions:
        node-exporter-host-access:
          namespace: monitoring
          match:
            any:
              - resources:
                  kinds:
                    - Pod
                  namespaces:
                    - monitoring
                  names:
                    - "node-exporter-*"
          exceptions:
            - policy_name: disallow-privileged-containers
              rule_names:
                - privileged-containers
        ci-runner-pods:
          namespace: ci
          match_kinds:
            - Pod
          exceptions:
            - policy_name: disallow-privileged-containers
              rule_names:
                - privileged-containers
      cluster_cleanup_policies:
        failed-jobs:
          schedule: "0 0 * * *"
          match_kinds:
            - Job
          conditions:
            all:
              - key: "{{ target.status.failed || `0` }}"
                operator: GreaterThan
                value: 0
      cleanup_policies:
        preview-pods:
          namespace: shop
          schedule: "*/30 * * * *"
          spec:
            deletionPropagationPolicy: Foreground
          match:
            any:
              - resources:
                  kinds:
                    - Pod
                  selector:
                    matchLabels:
                      env: preview
      validating_policies:
        # validation_actions unset: Kyverno denies a request that fails
        require-team-label:
          match_kinds:
            - Deployment
            - StatefulSet
          validations:
            - expression: "has(object.metadata.labels.team)"
              message: "label team is required"
        disallow-latest-tag:
          annotations:
            policies.kyverno.io/title: Disallow Latest Tag
          labels:
            policy-type: validation
          # match_kinds sets resourceRules, the namespaceSelector stays
          match_kinds:
            - Pod
          match_constraints:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
          validation_actions:
            - Audit
            - Warn
          # flat failure_policy wins over spec.failurePolicy and logs a warning
          failure_policy: Ignore
          spec:
            failurePolicy: Fail
            webhookConfiguration:
              timeoutSeconds: 15
          variables:
            - name: images
              expression: "object.spec.containers.map(c, c.image)"
          validations:
            - expression: "variables.images.all(image, !image.endsWith(':latest'))"
              message: "images must not use the latest tag"
      namespaced_validating_policies:
        require-requests:
          match_kinds:
            - Pod
          validations:
            - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests))"
              messageExpression: "'resource requests are required in namespace ' + object.metadata.namespace"
      mutating_policies:
        add-environment-label:
          match_kinds:
            - Deployment
            - StatefulSet
          mutations:
            - patchType: ApplyConfiguration
              applyConfiguration:
                expression: >-
                  Object{metadata: Object.metadata{labels: Object.metadata.labels{environment: "production"}}}
      namespaced_mutating_policies:
        disable-service-links:
          match_kinds:
            - Pod
          mutations:
            - patchType: JSONPatch
              jsonPatch:
                expression: >-
                  [JSONPatch{op: "add", path: "/spec/enableServiceLinks", value: false}]
      generating_policies:
        default-deny-ingress:
          match_kinds:
            - Namespace
          evaluation:
            synchronize:
              enabled: true
          variables:
            - name: nsName
              expression: "object.metadata.name"
            - name: downstream
              expression: >-
                [{"apiVersion": dyn("networking.k8s.io/v1"), "kind": dyn("NetworkPolicy"),
                "metadata": dyn({"name": "default-deny-ingress", "namespace": string(variables.nsName)}),
                "spec": dyn({"podSelector": dyn({}), "policyTypes": dyn(["Ingress"])})}]
          generate:
            - expression: "generator.Apply(variables.nsName, variables.downstream)"
      namespaced_generating_policies:
        service-account-config:
          match_kinds:
            - ServiceAccount
          variables:
            - name: downstream
              expression: >-
                [{"apiVersion": dyn("v1"), "kind": dyn("ConfigMap"),
                "metadata": dyn({"name": object.metadata.name + "-config", "namespace": object.metadata.namespace}),
                "data": dyn({"owner": object.metadata.name})}]
          generate:
            - expression: "generator.Apply(object.metadata.namespace, variables.downstream)"
      deleting_policies:
        succeeded-jobs:
          schedule: "0 1 * * *"
          match_kinds:
            - Job
          conditions:
            - name: succeeded
              expression: "has(object.status.succeeded) && object.status.succeeded > 0"
      namespaced_deleting_policies:
        preview-configmaps:
          schedule: "*/30 * * * *"
          deletion_propagation_policy: Foreground
          match_kinds:
            - ConfigMap
          match_constraints:
            objectSelector:
              matchLabels:
                env: preview
      cel_policy_exceptions:
        node-exporter-latest:
          namespace: monitoring
          policy_refs:
            - name: disallow-latest-tag
              kind: ValidatingPolicy
          match_conditions:
            - name: node-exporter
              expression: "object.metadata.name.startsWith('node-exporter-')"
          report_result: pass
