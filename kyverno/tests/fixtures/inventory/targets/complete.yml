# Complete: all policies.kyverno.io kinds, the match_kinds shorthand, spec
# passthrough, and flat keys overriding spec (each logs a warning).
classes: []

parameters:
  kapitan:
    vars:
      target: complete
    compile:
      - input_type: kadet
        input_paths:
          - lib/kyverno
        output_path: manifests/

  namespace: platform
  generators:
    kyverno:
      namespace: shop
      validating_policies:
        # validation_actions unset: Kyverno denies a request that fails
        require-team-label:
          match_kinds:
            - Deployment
            - StatefulSet
          validations:
            - expression: "has(object.metadata.labels) && has(object.metadata.labels.team)"
              message: "label team is required"
        disallow-latest-tag:
          annotations:
            policies.kyverno.io/title: Disallow Latest Tag
          labels:
            policy-type: validation
          # match_kinds sets resourceRules, the namespaceSelector stays
          match_kinds:
            - Pod
          match_constraints:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
          validation_actions:
            - Audit
            - Warn
          # flat failure_policy wins over spec.failurePolicy and logs a warning
          failure_policy: Ignore
          spec:
            failurePolicy: Fail
            webhookConfiguration:
              timeoutSeconds: 15
          variables:
            - name: images
              expression: "object.spec.containers.map(c, c.image)"
          validations:
            - expression: "variables.images.all(image, !image.endsWith(':latest'))"
              message: "images must not use the latest tag"
      namespaced_validating_policies:
        require-requests:
          match_kinds:
            - Pod
          validations:
            - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests))"
              messageExpression: "'resource requests are required in namespace ' + object.metadata.namespace"
      mutating_policies:
        add-environment-label:
          match_kinds:
            - Deployment
            - StatefulSet
          mutations:
            - patchType: ApplyConfiguration
              applyConfiguration:
                expression: >-
                  Object{metadata: Object.metadata{labels: Object.metadata.labels{environment: "production"}}}
      namespaced_mutating_policies:
        disable-service-links:
          match_kinds:
            - Pod
          mutations:
            - patchType: JSONPatch
              jsonPatch:
                expression: >-
                  [JSONPatch{op: "add", path: "/spec/enableServiceLinks", value: false}]
      generating_policies:
        default-deny-ingress:
          match_kinds:
            - Namespace
          evaluation:
            synchronize:
              enabled: true
          variables:
            - name: nsName
              expression: "object.metadata.name"
            - name: downstream
              expression: >-
                [{"apiVersion": dyn("networking.k8s.io/v1"), "kind": dyn("NetworkPolicy"),
                "metadata": dyn({"name": "default-deny-ingress", "namespace": string(variables.nsName)}),
                "spec": dyn({"podSelector": dyn({}), "policyTypes": dyn(["Ingress"])})}]
          generate:
            - expression: "generator.Apply(variables.nsName, variables.downstream)"
      namespaced_generating_policies:
        service-account-config:
          match_kinds:
            - ServiceAccount
          # generator.Apply of a namespaced policy takes only the resources,
          # which land in the policy's namespace
          variables:
            - name: saName
              expression: "object.metadata.name"
            - name: downstream
              expression: >-
                [{"apiVersion": dyn("v1"), "kind": dyn("ConfigMap"),
                "metadata": dyn({"name": string(variables.saName) + "-config"}),
                "data": dyn({"owner": string(variables.saName)})}]
          generate:
            - expression: "generator.Apply(variables.downstream)"
      deleting_policies:
        succeeded-jobs:
          schedule: "0 1 * * *"
          match_kinds:
            - Job
          conditions:
            - name: succeeded
              expression: "has(object.status) && has(object.status.succeeded) && object.status.succeeded > 0"
      namespaced_deleting_policies:
        preview-configmaps:
          schedule: "*/30 * * * *"
          deletion_propagation_policy: Foreground
          match_kinds:
            - ConfigMap
          match_constraints:
            objectSelector:
              matchLabels:
                env: preview
      cel_policy_exceptions:
        node-exporter-latest:
          namespace: monitoring
          policy_refs:
            - name: disallow-latest-tag
              kind: ValidatingPolicy
          # the exception's namespace does not limit it; the conditions do
          match_conditions:
            - name: monitoring-namespace
              expression: "object.metadata.namespace == 'monitoring'"
            - name: node-exporter
              expression: "object.metadata.name.startsWith('node-exporter-')"
          report_result: pass
