# QA-7: Kubernetes built-in groups are the kubernetes-json-schema
# standalone-strict files of this Kubernetes release, unchanged. CRD groups
# are the openAPIV3Schema of the upstream CRDs at these releases (Apache-2.0),
# closed like kubeconform strict mode: every node with properties gets
# additionalProperties: false, except preserve-unknown-fields nodes, maps and
# allOf/anyOf/oneOf/not branches. Unknown fields in the output therefore fail.
# cloud.google.com BackendConfig has no published CRD file and ships no schema.
