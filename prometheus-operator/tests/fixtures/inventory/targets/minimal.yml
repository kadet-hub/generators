# Minimal: one Prometheus with its RBAC and the selector shorthand, and a
# ServiceMonitor for its own Service that this Prometheus selects.
classes: []

parameters:
  kapitan:
    vars:
      target: minimal
    compile:
      - input_type: kadet
        input_paths:
          - lib/prometheus-operator
        output_path: manifests/prometheus-operator/

  namespace: monitoring
  generators:
    prometheus_operator:
      prometheuses:
        main:
          rbac: true
          service_account_name: prometheus
          service_monitor_selector:
            team: platform
      service_monitors:
        prometheus:
          labels:
            team: platform
          selector:
            operated-prometheus: "true"
          endpoints: web
