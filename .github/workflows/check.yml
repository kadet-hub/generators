name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # UPD-6: the deployment branch policies of the environments

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Jobs with secrets run in a main-only environment (UPD-6)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/workflow-policy
      - name: Tests of tools/upstream.py
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }} # CHK-4
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(tools/|\.github/)'; then
            uv run --with pyyaml==6.0.3 python3 -m unittest discover -s tools
          fi
      - name: Changed generators (CHK-4)
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }} # CHK-4
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(check$|\.github/)' <<<"$changed"; then
            dirs=$(for m in */kapitan-generator.yaml; do dirname "$m"; done)
          else
            dirs=$(cut -d/ -f1 <<<"$changed" | sort -u | while read -r d; do if [ -f "$d/kapitan-generator.yaml" ]; then echo "$d"; fi; done)
          fi
          echo "generators: ${dirs:-none}"
          echo "dirs=$(paste -sd " " <<<"$dirs")" >> "$GITHUB_OUTPUT"
      - name: Unit tests of changed generators (CHK-10)
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
          PYTHONDONTWRITEBYTECODE: "1" # SEC-5: ./check fails on bytecode in the tree
        run: |
          pytest=(uv run -p 3.12 --with pytest==9.2.0 --with kapitan==0.36.3 --with omegaconf==2.4.0.dev4)
          for d in $DIRS; do
            compgen -G "$d/tests/test_*.py" >/dev/null || continue
            echo "unit tests: $d"
            case $d in
              # they import constructor.py and mutations.py by top-level name
              ocm) (cd ocm && "${pytest[@]}" --with jsonschema==4.26.0 python3 -m pytest -q -p no:cacheprovider tests) ;;
              mutate) (cd mutate && "${pytest[@]}" python3 -m pytest -q -p no:cacheprovider tests) ;;
              # the directory name is no Python identifier
              opentelemetry-operator) "${pytest[@]}" python3 -m pytest -q -p no:cacheprovider --import-mode=importlib "$d/tests" ;;
              *) "${pytest[@]}" python3 -m pytest -q -p no:cacheprovider "$d/tests" ;;
            esac
          done
      - name: Gate checks for changed generators
        env:
          GH_TOKEN: ${{ github.token }} # CHK-9: downloads from GitHub
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: for d in $DIRS; do ./check "$d"; done
      - name: Compose golden of the docker generator (CHK-8)
        run: |
          docker compose version
          docker compose -f docker/tests/golden/compose.yml config --quiet
