name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate checks for changed generators
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(check$|\.github/)' <<<"$changed"; then
            dirs=$(for m in */kapitan-generator.yaml; do dirname "$m"; done)
          else
            dirs=$(cut -d/ -f1 <<<"$changed" | sort -u | while read -r d; do if [ -f "$d/kapitan-generator.yaml" ]; then echo "$d"; fi; done)
          fi
          echo "generators: ${dirs:-none}"
          for d in $dirs; do ./check "$d"; done
