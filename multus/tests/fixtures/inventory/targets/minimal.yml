# Minimal: one NetworkAttachmentDefinition with a raw JSON CNI config
classes: []

parameters:
  kapitan:
    vars:
      target: minimal
    compile:
      - input_type: kadet
        input_paths:
          - lib/multus
        output_path: manifests/

  namespace: default
  generators:
    multus:
      networks:
        macvlan-conf:
          config_json: |
            {"cniVersion":"0.3.1","type":"macvlan","master":"eth0","mode":"bridge","ipam":{"type":"host-local","subnet":"192.168.1.0/24","rangeStart":"192.168.1.200","rangeEnd":"192.168.1.216","routes":[{"dst":"0.0.0.0/0"}],"gateway":"192.168.1.1"}}
