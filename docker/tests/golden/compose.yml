services:
  miniflux:
    image: miniflux/miniflux:2.3.4@sha256:72e49f513a63104506aab98ba8cfc3a409d4fde23550a583dec07ec941f1e94e
    user: 65534:65534
    read_only: true
    environment:
      DATABASE_URL: postgres://miniflux:?{base64:fixture/db-password}@miniflux-db/miniflux?sslmode=disable
      RUN_MIGRATIONS: '1'
      CREATE_ADMIN: '1'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ?{base64:fixture/admin-password}
      POLLING_FREQUENCY: '60'
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - /usr/bin/miniflux
      - -healthcheck
      - auto
      interval: 5s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.05'
          memory: 64m
    restart: always
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      miniflux-db:
        condition: service_healthy
  miniflux-db:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    command:
    - -c
    - max_connections=50
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ?{base64:fixture/db-password}
      POSTGRES_DB: miniflux
    expose:
    - '5432'
    volumes:
    - miniflux-db:/var/lib/postgresql
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - miniflux
      interval: 10s
      timeout: 30s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: always
volumes:
  miniflux-db: {}
