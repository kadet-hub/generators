# Compose: Miniflux and its PostgreSQL in the kubernetes generator's
# component shape, as the miniflux recipe has them, with passwords as refs
# from refs/fixture/
classes: []

parameters:
  kapitan:
    vars:
      target: compose
    compile:
      - input_type: kadet
        output_type: plain
        input_paths:
          - lib/docker
        output_path: docker/

  applications:
    miniflux:
      component_defaults:
        enable_service_links: false

  components:
    miniflux:
      application: miniflux
      image: miniflux/miniflux:2.3.4@sha256:72e49f513a63104506aab98ba8cfc3a409d4fde23550a583dec07ec941f1e94e
      ports:
        http:
          container_port: 8080
          service_port: 80
      service:
        type: ClusterIP
      env:
        DATABASE_URL:
          secretKeyRef:
            key: DATABASE_URL
        RUN_MIGRATIONS: 1
        CREATE_ADMIN: 1
        ADMIN_USERNAME: admin
        ADMIN_PASSWORD:
          secretKeyRef:
            key: ADMIN_PASSWORD
        POLLING_FREQUENCY:
          configMapKeyRef:
            key: POLLING_FREQUENCY
      secrets:
        credentials:
          string_data:
            DATABASE_URL:
              value: postgres://miniflux:?{base64:fixture/db-password}@miniflux-db/miniflux?sslmode=disable
            ADMIN_PASSWORD:
              value: "?{base64:fixture/admin-password}"
      config_maps:
        settings:
          data:
            POLLING_FREQUENCY:
              value: "60"
      healthcheck:
        readiness:
          type: command
          command: [/usr/bin/miniflux, -healthcheck, auto]
          period_seconds: 5
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      security_context:
        runAsUser: 65534
        runAsGroup: 65534
      read_only_root_filesystem: true

    miniflux-db:
      application: miniflux
      type: statefulset
      image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      args:
        max_connections: [-c, max_connections=50]
      ports:
        postgresql:
          service_port: 5432
      service:
        type: ClusterIP
      env:
        POSTGRES_USER: miniflux
        POSTGRES_PASSWORD:
          secretKeyRef:
            key: POSTGRES_PASSWORD
        POSTGRES_DB: miniflux
      secrets:
        credentials:
          string_data:
            POSTGRES_PASSWORD:
              value: "?{base64:fixture/db-password}"
      healthcheck:
        readiness:
          type: command
          command: [pg_isready, -U, miniflux]
          initial_delay_seconds: 5
          timeout_seconds: 30
      resources:
        limits:
          memory: 512Mi
      volume_mounts:
        miniflux-db:
          mount_path: /var/lib/postgresql
      volume_claims:
        miniflux-db:
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi

  generators:
    docker:
      compose:
        services:
          miniflux:
            ports:
              - 127.0.0.1:8080:8080
            depends_on:
              miniflux-db:
                condition: service_healthy
